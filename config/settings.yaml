# All paths and parameters for the Cosmic Event pipeline.
# Any value can be overridden on the command line:  python run.py <step> --set spark.executor_memory=512m

# Two datasets live side by side and never mix: different HDFS base, Hive database and output folder.
# Every real-data path is derived from ONE setting, PROJECT_ROOT (datasets.real.project_root; the
# environment variable COSMIC_PROJECT_ROOT overrides it). Everything the v3 pipeline WRITES goes under
# V3_ROOT = PROJECT_ROOT/v3_5GB (environment variable V3_ROOT overrides it). See `paths:` below.
# The retired folders MyDrive/cosmic, cosmic_OLD_do_not_use and _OLD_100MB are refused by the code.
datasets:
  real:
    project_root: /content/drive/MyDrive/cosmic_roja   # PROJECT_ROOT
    hdfs_base: /cosmic
    database: cosmic
  synthetic:                                   # test data only (scripts/make_synthetic.py), relative to the repo
    project_root: synthetic_run
    data_subdir: data/synthetic/raw            # overrides of the layout below
    labels_file: data/synthetic/labels/vsx_labels.csv
    output_subdir: synthetic_run/outputs       # NEVER review2
    hdfs_base: /cosmic_synth
    database: cosmic_synth

paths:
  # read-only inputs, under PROJECT_ROOT
  data_subdir: data                            # AAVSO CSVs, directly in this folder (sub-folders are not read)
  cache_subdir: work/cache                     # Hadoop/Spark/Hive/Derby tarballs used by setup/install_stack.sh
  labels_file: work/labels/vsx_labels.csv      # VSX rows for our stars (extended when new stars appear)
  # everything written, under V3_ROOT = PROJECT_ROOT/v3_subdir
  v3_subdir: v3_5GB
  ztf_raw_subdir: ztf_raw                      # raw ZTF DR light-curve Parquet files (downloaded once)
  clean_subdir: clean                          # cleaned AAVSO + ZTF Parquet
  work_subdir: work                            # windows, .npz files, model checkpoints, run state
  output_subdir: outputs                       # tables, figures/, captions, COMPARISON.md, DATA_FLOW.txt
  dashboard_subdir: dashboard_data             # tidy tables for the Review 3 dashboard
  star_list: config/stars.yaml
  label_map: config/label_map.yaml

hdfs:
  namenode: hdfs://localhost:9000

spark:
  master: yarn
  app_name: cosmic-events
  deploy_mode: client
  driver_memory: 2g
  executor_instances: 2
  executor_cores: 1
  executor_memory: 1536m
  executor_memory_overhead: 512m
  shuffle_partitions: 48                     # real data: the observer self-join is the largest shuffle
  metastore_uri: thrift://localhost:9083
  metastore_version: 3.1.3
  warehouse_dir: /user/hive/warehouse

ingest:
  # Declination bands (degrees) used for the sky_region partition column.
  dec_band_edges: [-90, -30, 0, 30, 60, 90]
  pruning_test_year: null                      # null = the year with the most rows

# ZTF public light curves (IRSA bulk Parquet, one file per field / CCD / quadrant / filter)
ztf:
  release: dr24
  base_url: https://irsa.ipac.caltech.edu/data/ZTF/lc/lc_dr24
  api_url: https://irsa.ipac.caltech.edu/cgi-bin/ZTF/nph_light_curves
  fields_url: https://raw.githubusercontent.com/ZwickyTransientFacility/ztf_information/master/field_grid/ZTF_Fields.txt
  target_gb: [8, 10]                           # raw download: at least 8, at most 10 GB (>= 5 GB after cleaning)
  filters: [zg, zr, zi]
  match_arcsec: 2.0                            # AAVSO star <-> ZTF object cross-match radius
  saturation_mag: 12.5                         # ZTF saturates for stars brighter than about this
  min_star_epochs: 20                          # "usable" = at least this many unsaturated epochs
  neighbour_deg: 10                            # neighbouring fields considered (distance between field centres)
  max_neighbour_fields: 25                     # ...at most this many, nearest first (one VSX count query each)
  field_radius_deg: 3.5                        # VSX variables counted within this radius of a field centre
  tmp_dir: null                                # null = /content/ztf_tmp on Colab (local disk, before copying to Drive)

# VizieR (for VSX): tried in this order; the first server that answers a quick test query is used.
vizier:
  servers: [vizier.cds.unistra.fr, vizier.cfa.harvard.edu, vizier.iucaa.in, vizier.nao.ac.jp]
  probe_timeout_s: 30
  timeout_s: 180

# Faint-star candidates for more AAVSO downloads (VSX via astroquery only; AAVSO is never scraped)
candidates:
  n: 40                                        # balanced: half anomalous, half normal
  max_mag_range: [12.5, 16.0]                  # brightest (VSX 'max') magnitude: not saturated in ZTF
  min_mag_limit: 17.5                          # faintest (VSX 'min') magnitude no fainter than this
  dec_min: -25
  per_type_query_limit: 10000
  download_end_year: 2025                      # you download Jan 2022 - Jan 2025: later novae are excluded

audit:
  target_mb: 50                                # Review 2 size target; 1 MB = 1,048,576 bytes
  coverage_max_gap_days: 30                    # "continuous coverage" breaks at any gap longer than this

# Time windows (Step "windows", Spark): the samples for BOTH RGA-Net and the ML models.
windows:
  length_days: 100
  stride_days: 50                              # must be <= length_days (windows overlap or touch)
  min_obs: 20                                  # windows with fewer observations are dropped
  seq_len: 200                                 # L: tokens per window for RGA-Net (evenly spaced subsample / padding)
  max_bands: 12                                # most frequent bands get their own index; the rest share "other"
  max_obs_types: 6
  ls_max_points: 2000                          # Lomb-Scargle per window: random subsample cap (fixed seed)
  ls_seed: 7
  export_for_pytorch: true                     # write work/windows_seq.npz for RGA-Net (off in scalability runs)

# Star-grouped splits, shared by every model (same 5 splits for RGA-Net and the 4 ML models).
split:
  train: 0.70
  val: 0.15                                    # test = the rest (0.15)
  seeds: [1, 2, 3, 4, 5]                       # one different split per seed
  curves_seed: 1                               # the seed used for ROC/PR curves and confusion matrices

preprocess:
  # AAVSO comment codes that mark an observation as unreliable (any letter present -> dropped).
  # B sky bright, U clouds, W poor seeing, L low in sky, Z questionable accuracy, I identification uncertain, S comp-sequence problem
  unreliable_comment_codes: [B, U, W, L, Z, I, S]
  # Thinning dense time series: keep at most this many points per (star, band, observer, night), evenly
  # spaced in time, so a few CCD observers taking hundreds of points per night cannot dominate.
  # null or 0 switches thinning off. See docs/PREPROCESSING.md.
  max_obs_per_observer_night: 10
  min_group_size: 20                           # (star, band) groups smaller than this are dropped

observer_score:
  window_days: 1.0                             # Δt for the leave-one-out consensus
  min_residuals: 20                            # observers with fewer residuals get the population median score
  mad_scale: 1.4826

features:
  ls_min_points: 20                            # fewer detections than this -> Lomb-Scargle features imputed
  ls_min_period_days: 0.1
  ls_max_period_days: 1000.0
  ls_samples_per_peak: 5
  ls_max_points: 20000                         # random subsample cap per star (fixed seed) to bound cost
  ls_seed: 7

# The 4 ML models (Spark MLlib) on per-window summary features. Grids are tuned on the VALIDATION
# stars only (best validation PR-AUC); the decision threshold is chosen on validation (best F1).
classify:
  dt_max_depth: [3, 5, 8]
  dt_min_instances: [1, 10]
  rf_num_trees: [100]
  rf_max_depth: [5, 10]
  lr_reg_param: [0.001, 0.01, 0.1]
  lr_elastic_net: [0.0]
  lr_max_iter: 200

# RGA-Net (PyTorch). Small on purpose: we have few stars. Not tuned on test; early stopping and the
# decision threshold use the validation set only.
rganet:
  d_model: 64
  heads: 4
  layers: 2
  ff_mult: 2
  dropout: 0.2
  n_time_freqs: 16                             # sinusoidal time encoding: periods log-spaced over...
  time_min_period_days: 0.1                    # ...0.1 to...
  time_max_period_days: 1000.0                 # ...1000 days
  band_emb: 8
  type_emb: 4
  lambda_init: 0.0                             # λ = softplus(ρ); ρ starts at this value (softplus(0) = 0.69)
  eps: 0.001                                   # log(A_j + ε)
  lr: 0.001
  weight_decay: 0.01
  batch_size: 64
  max_epochs: 80
  patience: 12                                 # early stopping on validation PR-AUC
  grad_clip: 1.0
  variants: [full, no_gate, observer_blind]

# Distributed inference (Spark): which trained RGA-Net variants are applied to all windows.
infer:
  variants: [full]                             # one model per split seed; add no_gate / observer_blind if wanted

# Scalability: Spark preprocessing + windowing through YARN at 1, 2 and 4 executors, 3 runs each.
scalability:
  executors: [1, 2, 4]
  runs: 3
  executor_memory: 1g                          # identical for every run; small enough that 4 executors fit
  executor_memory_overhead: 384m
  executor_cores: 1

kmeans:
  k_min: 2
  k_max: 8
  seed: 42

plots:
  dpi: 300                                     # architecture diagram (Graphviz) resolution
  png_scale: 2                                 # Plotly PNG = width x height x this (e.g. 1600x900 -> 3200x1800)
  html_plotlyjs: true                          # embed plotly.js in each HTML (works offline); "cdn" = smaller files
  lightcurve_star: null                        # null = auto-pick the star with the most observers
  lightcurve_top_observers: 6
